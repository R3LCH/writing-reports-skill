interface:
  display_name: "GOST Reports — Word and PDF"
  short_description: "Build verified GOST reports in PDF and editable DOCX"
  default_prompt: "Use $writing-reports-pandoc-gost to create a report from my guidelines, cover page, content, and credentials. For paired GUAP DOCX/PDF prefer an editable Word master, fill the supplied cover separately, update fields and export PDF from the final DOCX. Use the pinned LaTeX route when required; verify all rendered pages and preserve source data."

policy:
  allow_implicit_invocation: true

